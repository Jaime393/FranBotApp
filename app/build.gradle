plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.franbot.oracle'
    compileSdk 34
    defaultConfig {
        applicationId "com.franbot.oracle"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "8.1"
    }
    signingConfigs {
        release {
            // Keystore en archivo; CI lo decodifica del secreto
            // ANDROID_KEYSTORE_BASE64. Claves por entorno o por
            // propiedades de Gradle (-PKEYSTORE_PASSWORD=...).
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: project.findProperty("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS") ?: project.findProperty("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD") ?: project.findProperty("KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Firma solo si el keystore existe. Sin el, assembleRelease
            // sigue funcionando pero el APK sale sin firmar.
            if (file(System.getenv("KEYSTORE_PATH") ?: "release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
}
